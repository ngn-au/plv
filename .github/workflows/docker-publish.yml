# =============================================================================
# Publish image — builds the production image and pushes a multi-arch manifest
# (linux/amd64 + linux/arm64) to ghcr.io/<owner>/plv.
#
# The Go build cross-compiles inside the Dockerfile (the builder stage runs on
# the native arch via --platform=$BUILDPLATFORM and sets GOOS/GOARCH), so only
# the tiny final `apk add tzdata` step needs QEMU — the build stays fast.
#
# Triggers / tags:
#   • push to main      → `edge`
#   • push of vX.Y.Z    → `X.Y.Z`, `X.Y`, and `latest`
#   • workflow_dispatch  → build & publish an existing tag passed as input
#     (leave the input blank to build the current ref)
#
# Auth uses the built-in GITHUB_TOKEN — no registry secrets to manage.
#
# NOTE: the first run creates the GHCR package as PRIVATE. To let `docker pull`
# work anonymously and for the README ghcr-badge to render, set the package to
# Public once: GitHub → Packages → plv → Package settings → Change visibility →
# Public (and "Connect repository" to inherit access).
# =============================================================================

name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build & publish (e.g. v1.0.0). Leave blank to build the current ref."
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege at the top level; the publish job elevates to packages: write.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # ghcr.io/ngn-au/plv

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Build the dispatched tag's source when given, else the trigger ref.
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Build provenance for the version chip (see buildmeta.go): always stamp the short
      # SHA; mark RELEASE=true only for a vX.Y.Z tag build (or a dispatch against one), so
      # the chip reads "1.0.1" for releases and "1.0.1+<sha>" for edge/main images.
      - name: Resolve build provenance
        id: ver
        run: |
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          if [ -n "${{ github.event.inputs.tag }}" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag set:
      #   • push to main          → `edge`
      #   • vX.Y.Z tag push       → `X.Y.Z`, `X.Y`, `latest`
      #   • dispatch with `tag`   → same semver set for that existing tag
      - name: Compute tags + labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=edge,branch=main,enable=${{ github.event_name == 'push' && github.ref_type == 'branch' }}
            type=semver,pattern={{version}},value=${{ github.event.inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.tag }}
          flavor: |
            latest=${{ github.ref_type == 'tag' || github.event.inputs.tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ steps.ver.outputs.sha }}
            RELEASE=${{ steps.ver.outputs.release }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Keep the published manifest to just the two arches (no extra
          # "unknown/unknown" provenance entries cluttering the package).
          provenance: false
