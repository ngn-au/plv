# =============================================================================
# Dependency review — blocks a PR that adds a dependency with a known
# high/critical CVE or a disallowed license, before it ever lands on main.
#
# Complements the other layers:
#   • Dependabot        — opens PRs to update deps + flags CVEs in deps on main.
#   • CI govulncheck    — gates the module graph + stdlib on known vulns.
#   • THIS              — gates the *diff*: catches a vulnerable / odd-licensed
#                         dependency at the moment a PR introduces it.
#
# Uses the dependency graph (on by default for public repos). No secrets.
# =============================================================================

name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # post the summary comment on failure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
          # MIT project — keep the dependency tree to permissive/compatible licenses.
          deny-licenses: AGPL-1.0-only, AGPL-3.0-only, GPL-2.0-only, GPL-3.0-only
          comment-summary-in-pr: on-failure
