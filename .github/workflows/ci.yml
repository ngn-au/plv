# =============================================================================
# CI — runs on every PR, every push to main, and every vX.Y.Z tag.
#
# Gates a change on the same checks a maintainer would run locally:
#   • go:           gofmt, go vet, build, and the race-enabled test suite.
#   • govulncheck:  the official Go vulnerability scanner (deps + stdlib).
#   • docker:       the production image still builds from a clean checkout.
#
# The `go` and `govulncheck` jobs run locally under act (see .actrc / Makefile);
# the docker job needs a real runner. Nothing here is published — see
# docker-publish.yml for GHCR and release.yml for binaries.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Format + vet + build + race-enabled tests.
  # ---------------------------------------------------------------------------
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -ldflags="-s -w" ./...

      - name: Test (race)
        run: go test -race ./...

  # ---------------------------------------------------------------------------
  # Official Go vulnerability scanner (golang.org/x/vuln).
  # ---------------------------------------------------------------------------
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        # Pinned (not @latest) so Scorecard's Pinned-Dependencies check passes; bump
        # deliberately. The vulnerability database is always fetched fresh at run time.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Run govulncheck
        run: govulncheck ./...

  # ---------------------------------------------------------------------------
  # Prove the production image still builds from a clean checkout.
  # Build-only: nothing is pushed (publishing lives in docker-publish.yml).
  # ---------------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build image (amd64, no push)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
