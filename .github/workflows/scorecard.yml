# =============================================================================
# OpenSSF Scorecard — supply-chain security posture audit.
#
# Scores the repo against the OpenSSF checks (branch protection, pinned
# dependencies, token permissions, dangerous workflow patterns, signed releases,
# etc.) and uploads the results to Security → Code scanning as SARIF. With
# `publish_results: true` the score also feeds the public Scorecard badge in the
# README.
#
# Runs weekly and whenever a branch-protection rule changes. Uses GITHUB_TOKEN +
# OIDC, plus an OPTIONAL `SCORECARD_TOKEN` secret: a fine-grained PAT with
# Administration:read so the Branch-Protection check can read the rules (the
# default GITHUB_TOKEN cannot read classic branch protection). When the secret is
# absent the workflow falls back to GITHUB_TOKEN and every other check still runs.
# =============================================================================

name: Scorecard supply-chain

on:
  branch_protection_rule:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      id-token: write # OIDC token for publish_results
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run analysis
        # Pinned to an immutable commit SHA (not a tag): a moved tag is a
        # supply-chain vector. CodeQL's actions query enforces this.
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # Prefer the admin-read PAT (lets the Branch-Protection check read the
          # rules); fall back to GITHUB_TOKEN when the secret isn't set.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: results.sarif
